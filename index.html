<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowchart Developer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&display=swap');

:root {
  --bg: #f5f0e8;
  --surface: #ede8df;
  --panel: #e8e2d8;
  --border: #c8bfad;
  --ink: #1a1610;
  --muted: #7a6e60;
  --accent: #c0392b;
  --accent2: #2c7a4b;
  --accent3: #1a5276;
  --accent4: #7d3c98;
  --gold: #b7860b;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Fraunces', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 28px;
  border-bottom: 2px solid var(--ink);
  background: var(--surface);
  flex-shrink: 0;
}

.logo { display: flex; align-items: baseline; gap: 10px; }
.logo-title { font-size: 1.4rem; font-weight: 900; letter-spacing: -0.03em; }
.logo-title em { font-style: italic; color: var(--accent); }
.logo-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem; color: var(--muted);
  letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid var(--border); padding: 2px 7px; border-radius: 2px;
}
.header-right {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem; color: var(--muted); text-align: right; line-height: 1.6;
}

.app { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 57px); }

.input-panel {
  width: 380px; flex-shrink: 0;
  display: flex; flex-direction: column;
  border-right: 2px solid var(--ink);
  background: var(--panel);
}

.panel-header {
  padding: 12px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-title { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.hint { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); padding: 2px 7px; border-radius: 2px; }

textarea {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--ink); font-family: 'IBM Plex Mono', monospace;
  font-size: 0.82rem; line-height: 1.75; padding: 18px; resize: none;
  caret-color: var(--accent);
}
textarea::placeholder { color: var(--muted); font-style: italic; font-family: 'Fraunces', serif; font-size: 0.88rem; }

.input-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.footer-row { display: flex; align-items: center; justify-content: space-between; }
.char-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); }

.mode-select { display: flex; gap: 4px; }
.mode-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem;
  padding: 3px 9px; border-radius: 2px; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); cursor: pointer;
  transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.06em;
}
.mode-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.generate-btn {
  background: var(--ink); color: var(--bg); border: none;
  padding: 11px 18px; border-radius: 3px;
  font-family: 'Fraunces', serif; font-weight: 700; font-size: 0.95rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: all 0.15s; letter-spacing: -0.01em;
}
.generate-btn:hover { background: var(--accent); }

.legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px; border-top: 1px solid var(--border); }
.legend-item { display: flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--muted); }
.legend-dot { width: 12px; height: 12px; border: 1.5px solid; flex-shrink: 0; }

.canvas-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.canvas-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 18px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
.toolbar-btns { display: flex; gap: 5px; }
.tool-btn {
  background: var(--panel); border: 1px solid var(--border); color: var(--ink);
  padding: 5px 11px; border-radius: 2px;
  font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem;
  cursor: pointer; transition: all 0.12s; text-transform: uppercase; letter-spacing: 0.05em;
}
.tool-btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.node-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); }

#flow-container {
  flex: 1; overflow: auto;
  background:
    linear-gradient(rgba(200,191,173,0.3) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,191,173,0.3) 1px, transparent 1px),
    var(--bg);
  background-size: 30px 30px;
  position: relative;
}
#flow-container::-webkit-scrollbar { width: 6px; height: 6px; }
#flow-container::-webkit-scrollbar-track { background: var(--bg); }
#flow-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
#flowchart-svg { display: block; }

.empty-state {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; pointer-events: none;
}
.empty-icon { font-size: 2.5rem; opacity: 0.15; }
.empty-text { font-size: 1.1rem; font-weight: 700; color: var(--muted); letter-spacing: -0.02em; }
.empty-sub { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--muted); opacity: 0.6; }

.tooltip {
  position: fixed; background: var(--ink); color: var(--bg);
  border-radius: 3px; padding: 8px 12px;
  font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem;
  pointer-events: none; opacity: 0; transition: opacity 0.15s;
  z-index: 999; max-width: 280px; line-height: 1.5;
}
.tooltip.visible { opacity: 1; }

@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.node-g { animation: fadeUp 0.3s ease both; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-title">Flow<em>Chart</em> Dev</div>
    <div class="logo-sub">No-API · Offline</div>
  </div>
  <div class="header-right">
    Paste study text → instant flowchart<br>
    Ctrl+Enter to generate
  </div>
</header>

<div class="app">
  <div class="input-panel">
    <div class="panel-header">
      <div class="panel-title">// Your Study Text</div>
      <div class="hint">Ctrl+Enter</div>
    </div>

    <textarea id="user-input" maxlength="20000"
      placeholder="Paste your study material here...

Works best with:
• Numbered steps  1. Do this  2. Then that
• Bullet points   • Step one  • Step two
• Keywords: IF, THEN, ELSE, WHEN, FIRST, NEXT, FINALLY
• Plain paragraphs of theory
• Mixed content

Example:
1. User opens the app
2. IF user is logged in THEN go to dashboard
3. ELSE show login form
4. User enters credentials
5. IF valid THEN create session
6. ELSE show error"></textarea>

    <div class="input-footer">
      <div class="footer-row">
        <div class="char-count"><span id="char-num">0</span> / 20000</div>
        <div class="mode-select">
          <button class="mode-btn active" id="mode-auto"  onclick="setMode('auto')">Auto</button>
          <button class="mode-btn"        id="mode-steps" onclick="setMode('steps')">Steps</button>
          <button class="mode-btn"        id="mode-para"  onclick="setMode('para')">Para</button>
        </div>
      </div>
      <button class="generate-btn" onclick="generateFlowchart()">◈ Build Flowchart</button>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="border-color:#c0392b;background:rgba(192,57,43,0.1);border-radius:50%"></div>Start/End</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:#1a5276;background:rgba(26,82,118,0.1)"></div>Process</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:#2c7a4b;background:rgba(44,122,75,0.1);transform:rotate(45deg)"></div>Decision</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:#7d3c98;background:rgba(125,60,152,0.1);transform:skewX(-8deg)"></div>I/O</div>
    </div>
  </div>

  <div class="canvas-area">
    <div class="canvas-toolbar">
      <div class="toolbar-btns">
        <button class="tool-btn" onclick="zoomIn()">+ Zoom</button>
        <button class="tool-btn" onclick="zoomOut()">− Zoom</button>
        <button class="tool-btn" onclick="resetZoom()">⊙ Fit</button>
        <button class="tool-btn" onclick="downloadSVG()">↓ SVG</button>
        <button class="tool-btn" onclick="clearChart()">✕ Clear</button>
      </div>
      <div class="node-count" id="node-count"></div>
    </div>

    <div id="flow-container">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">◈</div>
        <div class="empty-text">Paste text, build flowchart</div>
        <div class="empty-sub">No AI · No API · Fully offline</div>
      </div>
      <svg id="flowchart-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
let zoom = 1, svgString = '', parseMode = 'auto';
const inputEl = document.getElementById('user-input');
const svgEl   = document.getElementById('flowchart-svg');
const emptyEl = document.getElementById('empty-state');
const tipEl   = document.getElementById('tooltip');

inputEl.addEventListener('input', () => {
  document.getElementById('char-num').textContent = inputEl.value.length;
});

function setMode(m) {
  parseMode = m;
  ['auto','steps','para'].forEach(x =>
    document.getElementById('mode-'+x).classList.toggle('active', x === m));
}

function zoomIn()   { zoom = Math.min(zoom+0.15, 3);   applyZoom(); }
function zoomOut()  { zoom = Math.max(zoom-0.15, 0.2); applyZoom(); }
function resetZoom(){ zoom = 1; applyZoom(); }
function applyZoom(){ svgEl.style.transform = `scale(${zoom})`; svgEl.style.transformOrigin = 'top left'; }

function clearChart() {
  svgEl.innerHTML = ''; emptyEl.style.display = 'flex';
  document.getElementById('node-count').textContent = ''; svgString = '';
}

function downloadSVG() {
  if (!svgString) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([svgString], {type:'image/svg+xml'}));
  a.download = 'flowchart.svg'; a.click();
}

function showTip(e,t){ tipEl.textContent=t; tipEl.classList.add('visible'); moveTip(e); }
function moveTip(e)  { tipEl.style.left=(e.clientX+14)+'px'; tipEl.style.top=(e.clientY-8)+'px'; }
function hideTip()   { tipEl.classList.remove('visible'); }

// ── PARSER ────────────────────────────────────────────────────────────────────
const RX_DECISION = /\b(if|else|elif|otherwise|when|unless|whether|check|verify|validate|is|are|does|do|can|should|might|either|case|switch)\b/i;
const RX_IO       = /\b(input|output|read|write|display|show|print|prompt|enter|type|receive|send|return|get|fetch|load|save|store|log)\b/i;
const RX_TERMINAL = /\b(start|begin|end|stop|finish|terminate|exit|done|complete|halt|launch|initiate)\b/i;

function detectType(text) {
  if (RX_TERMINAL.test(text)) return 'terminal';
  if (RX_DECISION.test(text)) return 'decision';
  if (RX_IO.test(text))       return 'io';
  return 'process';
}

function cleanLine(line) {
  return line.replace(/^\s*(\d+[\.\)]\s*|[-•*▪►→]\s*)/, '').replace(/\s+/g,' ').trim();
}

function splitIntoSteps(text) {
  // Numbered list
  const numbered = text.match(/^\s*\d+[\.\)].+/gm);
  if (numbered && numbered.length >= 2) return numbered.map(cleanLine).filter(s => s.length > 3);
  // Bullets
  const bullets = text.match(/^\s*[-•*▪►→].+/gm);
  if (bullets && bullets.length >= 2) return bullets.map(cleanLine).filter(s => s.length > 3);
  // Sentences
  return text.split(/(?<=[.!?])\s+(?=[A-Z])|[\n\r]+/)
    .map(s => s.trim()).filter(s => s.length > 8);
}

function splitParagraphs(text) {
  const paras = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const steps = [];
  paras.forEach(para => {
    const inner = splitIntoSteps(para);
    if (inner.length > 1) steps.push(...inner);
    else steps.push(para);
  });
  return steps;
}

function parseText(text) {
  let steps;
  if (parseMode === 'steps')     steps = splitIntoSteps(text);
  else if (parseMode === 'para') steps = splitParagraphs(text);
  else {
    steps = splitIntoSteps(text);
    if (steps.length < 3) steps = splitParagraphs(text);
  }
  if (!steps.length) return null;

  const nodes = [];
  const edges = [];
  nodes.push({ id:'start', type:'terminal', label:'Start', full:'Starting point' });

  let decisionStack = [];

  steps.forEach((step, i) => {
    const id   = 'n'+i;
    const type = detectType(step);
    const label = step.length > 40 ? step.slice(0,38)+'…' : step;
    nodes.push({ id, type, label, full: step });

    const prevId = i === 0 ? 'start' : 'n'+(i-1);
    const prevNode = nodes.find(n => n.id === prevId);

    if (prevNode && prevNode.type === 'decision') {
      edges.push({ from: prevId, to: id, label: 'Yes' });
      decisionStack.push({ decId: prevId, elseConnected: false });
    } else {
      edges.push({ from: prevId, to: id });
    }

    if (/\b(else|otherwise|if not|if no)\b/i.test(step) && decisionStack.length > 0) {
      const last = decisionStack[decisionStack.length-1];
      if (!last.elseConnected) {
        edges.push({ from: last.decId, to: id, label: 'No' });
        last.elseConnected = true;
      }
    }
  });

  const lastId = 'n'+(steps.length-1);
  nodes.push({ id:'end', type:'terminal', label:'End', full:'End of process' });
  edges.push({ from: lastId, to: 'end' });

  decisionStack.forEach(d => {
    if (!d.elseConnected) edges.push({ from: d.decId, to: 'end', label: 'No' });
  });

  return { nodes, edges };
}

// ── LAYOUT ────────────────────────────────────────────────────────────────────
const NW=210, NH=58, HGAP=80, VGAP=95;

function layout(nodes, edges) {
  const levels = {};
  levels['start'] = 0;
  const queue = ['start'];
  const visited = new Set();
  while (queue.length) {
    const id = queue.shift();
    if (visited.has(id)) continue;
    visited.add(id);
    edges.filter(e => e.from === id).forEach(e => {
      levels[e.to] = Math.max(levels[e.to]||0, (levels[id]||0)+1);
      queue.push(e.to);
    });
  }
  const byLevel = {};
  nodes.forEach(n => {
    const l = levels[n.id]||0;
    if (!byLevel[l]) byLevel[l] = [];
    byLevel[l].push(n.id);
  });
  const pos = {};
  const MARGIN = 50;
  Object.keys(byLevel).sort((a,b)=>a-b).forEach(lv => {
    const ids = byLevel[lv];
    ids.forEach((id,i) => {
      pos[id] = { x: MARGIN + i*(NW+HGAP), y: MARGIN + lv*(NH+VGAP) };
    });
  });
  return pos;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
const COLORS = {
  terminal: { fill:'rgba(192,57,43,0.1)',   stroke:'#c0392b', text:'#c0392b' },
  process:  { fill:'rgba(26,82,118,0.08)',   stroke:'#1a5276', text:'#1a5276' },
  decision: { fill:'rgba(44,122,75,0.1)',    stroke:'#2c7a4b', text:'#2c7a4b' },
  io:       { fill:'rgba(125,60,152,0.1)',   stroke:'#7d3c98', text:'#7d3c98' },
};

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function wrapText(text, maxChars) {
  const words = text.split(' ');
  const lines = []; let line = '';
  words.forEach(w => {
    if ((line+' '+w).trim().length > maxChars) { if(line) lines.push(line.trim()); line=w; }
    else line = (line+' '+w).trim();
  });
  if (line) lines.push(line.trim());
  return lines;
}

function renderSVG(data) {
  const { nodes, edges } = data;
  const pos = layout(nodes, edges);
  let maxX=0, maxY=0;
  Object.values(pos).forEach(p => { maxX=Math.max(maxX,p.x+NW+60); maxY=Math.max(maxY,p.y+NH+80); });
  maxX=Math.max(maxX,700); maxY=Math.max(maxY,400);

  let s = `<defs>
    <marker id="arr"     markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#c8bfad"/></marker>
    <marker id="arr-yes" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#2c7a4b"/></marker>
    <marker id="arr-no"  markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#c0392b"/></marker>
  </defs>`;

  // Edges
  edges.forEach(edge => {
    const f=pos[edge.from], t=pos[edge.to];
    if (!f||!t) return;
    const x1=f.x+NW/2, y1=f.y+NH, x2=t.x+NW/2, y2=t.y, my=(y1+y2)/2;
    const d=`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
    const isY=edge.label==='Yes', isN=edge.label==='No';
    const col=isY?'#2c7a4b':isN?'#c0392b':'#c8bfad';
    const mk=isY?'arr-yes':isN?'arr-no':'arr';
    s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" opacity="0.8" marker-end="url(#${mk})"/>`;
    if (edge.label) {
      const lx=(x1+x2)/2, ly=my;
      s+=`<rect x="${lx-14}" y="${ly-9}" width="28" height="17" rx="3" fill="#f5f0e8" stroke="${col}" stroke-width="1"/>`;
      s+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" fill="${col}">${esc(edge.label)}</text>`;
    }
  });

  // Nodes
  nodes.forEach((node,idx) => {
    const p=pos[node.id]; if(!p) return;
    const {x,y}=p, c=COLORS[node.type]||COLORS.process;
    const delay=idx*0.05;
    const lines=wrapText(node.label,26);
    const lineH=16, textY=y+NH/2-((lines.length-1)*lineH)/2;

    s+=`<g class="node-g" style="animation-delay:${delay}s" onmouseenter="showTip(event,'${esc(node.full)}')" onmousemove="moveTip(event)" onmouseleave="hideTip()">`;

    if (node.type==='terminal') {
      s+=`<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="28" fill="${c.fill}" stroke="${c.stroke}" stroke-width="2"/>`;
    } else if (node.type==='decision') {
      const cx=x+NW/2, cy=y+NH/2, hw=NW/2, hh=NH/2+12;
      s+=`<polygon points="${cx},${cy-hh} ${cx+hw},${cy} ${cx},${cy+hh} ${cx-hw},${cy}" fill="${c.fill}" stroke="${c.stroke}" stroke-width="2"/>`;
    } else if (node.type==='io') {
      const sk=16;
      s+=`<polygon points="${x+sk},${y} ${x+NW},${y} ${x+NW-sk},${y+NH} ${x},${y+NH}" fill="${c.fill}" stroke="${c.stroke}" stroke-width="2"/>`;
    } else {
      s+=`<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="5" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1.5"/>`;
    }

    lines.forEach((line,li) => {
      s+=`<text x="${x+NW/2}" y="${textY+li*lineH+5}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="${c.text}">${esc(line)}</text>`;
    });

    s+=`</g>`;
  });

  svgEl.setAttribute('width', maxX);
  svgEl.setAttribute('height', maxY);
  svgEl.setAttribute('viewBox', `0 0 ${maxX} ${maxY}`);
  svgEl.innerHTML = s;
  svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${maxX}" height="${maxY}" viewBox="0 0 ${maxX} ${maxY}">${s}</svg>`;
  emptyEl.style.display = 'none';
  document.getElementById('node-count').textContent = `${nodes.length} nodes · ${edges.length} edges`;
}

function generateFlowchart() {
  const text = inputEl.value.trim();
  if (!text) return;
  const data = parseText(text);
  if (!data || data.nodes.length < 2) {
    emptyEl.querySelector('.empty-text').textContent = 'Add numbers (1. 2. 3.) or bullets to your text';
    emptyEl.style.display = 'flex'; return;
  }
  renderSVG(data);
  resetZoom();
}

inputEl.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter') generateFlowchart();
});
</script>
</body>
</html>
