<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowchart Developer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --panel: #16161f;
    --border: #2a2a3a;
    --accent: #00e5ff;
    --accent2: #b57bee;
    --accent3: #39ff88;
    --text: #e8e8f0;
    --muted: #6b6b88;
    --node-process: #1a2a3a;
    --node-decision: #1e1a2e;
    --node-terminal: #0d1f1a;
    --node-io: #1f1a10;
    --border-process: #00e5ff;
    --border-decision: #b57bee;
    --border-terminal: #39ff88;
    --border-io: #ffb830;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    z-index: 10;
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-text {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .logo-text span { color: var(--accent); }

  .header-badges {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .badge.live { border-color: var(--accent3); color: var(--accent3); }

  /* MAIN LAYOUT */
  .app {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 61px);
  }

  /* LEFT PANEL */
  .input-panel {
    width: 360px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--panel);
  }

  .panel-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--border);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 0.97rem;
    line-height: 1.7;
    padding: 20px;
    resize: none;
    caret-color: var(--accent);
  }

  textarea::placeholder { color: var(--muted); }

  .input-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .char-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-align: right;
  }

  .generate-btn {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #000;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.2s, transform 0.15s;
    letter-spacing: 0.02em;
  }

  .generate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .generate-btn:active { transform: translateY(0); }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .loading .btn-spinner { display: block; }
  .loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* EXAMPLES */
  .examples {
    padding: 12px 20px 0;
  }

  .examples-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .example-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface);
  }

  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* CANVAS AREA */
  .canvas-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .canvas-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .toolbar-left {
    display: flex;
    gap: 6px;
  }

  .tool-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }

  .legend {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: var(--muted);
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
    border: 1.5px solid;
  }

  /* FLOWCHART SVG CANVAS */
  #flow-container {
    flex: 1;
    overflow: auto;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(0,229,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(181,123,238,0.04) 0%, transparent 60%),
      var(--bg);
    position: relative;
  }

  #flow-container::-webkit-scrollbar { width: 6px; height: 6px; }
  #flow-container::-webkit-scrollbar-track { background: var(--bg); }
  #flow-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* DOT GRID */
  #flow-container::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  #flowchart-svg {
    display: block;
    min-width: 100%;
    min-height: 100%;
  }

  /* EMPTY STATE */
  .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    pointer-events: none;
  }

  .empty-icon {
    font-size: 3rem;
    opacity: 0.18;
  }

  .empty-text {
    font-size: 1rem;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .empty-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0.6;
  }

  /* NODE STYLES in SVG */
  .node-rect { filter: drop-shadow(0 2px 12px rgba(0,0,0,0.4)); cursor: pointer; }
  .node-text { font-family: 'Syne', sans-serif; font-size: 13px; fill: #e8e8f0; font-weight: 600; }
  .node-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #6b6b88; }
  .edge-path { fill: none; stroke-width: 1.8; marker-end: url(#arrowhead); }
  .edge-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; }

  /* TOOLTIP */
  .tooltip {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: var(--text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    max-width: 220px;
    line-height: 1.5;
    font-family: 'JetBrains Mono', monospace;
  }

  .tooltip.visible { opacity: 1; }

  /* ANIMATE IN */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .node-group { animation: fadeInUp 0.35s ease both; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">◈</div>
    <div class="logo-text">Flow<span>Chart</span> Dev</div>
  </div>
  <div class="header-badges">
    <div class="badge live">● LIVE</div>
    <div class="badge">AI-POWERED</div>
    <div class="badge">v1.0</div>
  </div>
</header>

<div class="app">

  <!-- LEFT: INPUT -->
  <div class="input-panel">
    <div class="panel-label">// INPUT STATEMENT</div>

    <div class="examples">
      <div class="examples-label">Try an example</div>
      <div class="example-chips">
        <div class="chip" onclick="setExample(this)">Login System</div>
        <div class="chip" onclick="setExample(this)">Bubble Sort</div>
        <div class="chip" onclick="setExample(this)">ATM Machine</div>
        <div class="chip" onclick="setExample(this)">TCP Handshake</div>
        <div class="chip" onclick="setExample(this)">Order Checkout</div>
      </div>
    </div>

    <textarea id="user-input" placeholder="Describe any concept, algorithm, process, or system...

Examples:
• How does JWT authentication work?
• Explain the binary search algorithm
• What happens when you type a URL?
• How does a database transaction work?" maxlength="2000000"></textarea>

    <div class="input-footer">
      <div class="char-count"><span id="char-num">0</span> / 2000000</div>
      <button class="generate-btn" id="gen-btn" onclick="generateFlowchart()">
        <div class="btn-spinner"></div>
        <span class="btn-text">⟶ Generate Flowchart</span>
      </button>
    </div>
  </div>

  <!-- RIGHT: CANVAS -->
  <div class="canvas-area">
    <div class="canvas-toolbar">
      <div class="toolbar-left">
        <button class="tool-btn" onclick="zoomIn()">＋ Zoom</button>
        <button class="tool-btn" onclick="zoomOut()">－ Zoom</button>
        <button class="tool-btn" onclick="resetZoom()">⊙ Reset</button>
        <button class="tool-btn" onclick="downloadSVG()">↓ Export SVG</button>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="border-color:#00e5ff; background:rgba(0,229,255,0.15)"></div>Process</div>
        <div class="legend-item"><div class="legend-dot" style="border-color:#b57bee; background:rgba(181,123,238,0.15); transform:rotate(45deg)"></div>Decision</div>
        <div class="legend-item"><div class="legend-dot" style="border-color:#39ff88; background:rgba(57,255,136,0.15); border-radius:50%"></div>Start/End</div>
        <div class="legend-item"><div class="legend-dot" style="border-color:#ffb830; background:rgba(255,184,48,0.15); transform:skewX(-8deg)"></div>I/O</div>
      </div>
    </div>

    <div id="flow-container">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">◈</div>
        <div class="empty-text">Your flowchart appears here</div>
        <div class="empty-sub">Type a concept → Generate</div>
      </div>
      <svg id="flowchart-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let currentZoom = 1;
let svgData = null;

const input = document.getElementById('user-input');
const genBtn = document.getElementById('gen-btn');
const svg = document.getElementById('flowchart-svg');
const emptyState = document.getElementById('empty-state');
const tooltip = document.getElementById('tooltip');

input.addEventListener('input', () => {
  document.getElementById('char-num').textContent = input.value.length;
});

// ─── EXAMPLES ────────────────────────────────────────────────────────────────
const examples = {
  'Login System': 'Explain how a user login and authentication system works, including username/password validation, session creation, and handling failed attempts.',
  'Bubble Sort': 'Explain the bubble sort algorithm step by step — how it compares adjacent elements, swaps them if out of order, and repeats until the array is sorted.',
  'ATM Machine': 'How does an ATM machine work? Explain the process from inserting a card to dispensing cash, including PIN verification and balance checks.',
  'TCP Handshake': 'Explain the TCP three-way handshake process used to establish a connection between client and server.',
  'Order Checkout': 'Explain the e-commerce order checkout process from cart review to payment processing and order confirmation.'
};

function setExample(el) {
  input.value = examples[el.textContent];
  document.getElementById('char-num').textContent = input.value.length;
}

// ─── ZOOM ─────────────────────────────────────────────────────────────────────
function zoomIn() { currentZoom = Math.min(currentZoom + 0.2, 3); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom - 0.2, 0.3); applyZoom(); }
function resetZoom() { currentZoom = 1; applyZoom(); }
function applyZoom() {
  svg.style.transform = `scale(${currentZoom})`;
  svg.style.transformOrigin = 'top left';
}

// ─── DOWNLOAD ─────────────────────────────────────────────────────────────────
function downloadSVG() {
  if (!svgData) return;
  const blob = new Blob([svgData], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'flowchart.svg'; a.click();
  URL.revokeObjectURL(url);
}

// ─── TOOLTIP ──────────────────────────────────────────────────────────────────
function showTooltip(e, text) {
  tooltip.textContent = text;
  tooltip.classList.add('visible');
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

// ─── PARSE AI RESPONSE ────────────────────────────────────────────────────────
function parseNodes(text) {
  // Extract JSON from AI response
  const jsonMatch = text.match(/```json\s*([\s\S]*?)\s*```/) ||
                    text.match(/\{[\s\S]*"nodes"[\s\S]*\}/);
  if (jsonMatch) {
    try {
      const raw = jsonMatch[1] || jsonMatch[0];
      return JSON.parse(raw);
    } catch(e) {}
  }
  // Try direct parse
  try {
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    if (start !== -1 && end !== -1) {
      return JSON.parse(text.slice(start, end + 1));
    }
  } catch(e) {}
  return null;
}

// ─── BUILD SVG ────────────────────────────────────────────────────────────────
const NODE_W = 200;
const NODE_H = 60;
const DECISION_SIZE = 80;
const TERMINAL_RX = 30;
const H_GAP = 260;
const V_GAP = 110;

function buildFlowchart(data) {
  const nodes = data.nodes;
  const edges = data.edges;

  // Layout: topological levels
  const levels = assignLevels(nodes, edges);
  const positions = computePositions(nodes, edges, levels);

  // SVG dimensions
  let maxX = 0, maxY = 0;
  Object.values(positions).forEach(p => {
    maxX = Math.max(maxX, p.x + NODE_W + 60);
    maxY = Math.max(maxY, p.y + NODE_H + 80);
  });
  maxX = Math.max(maxX, 600);
  maxY = Math.max(maxY, 400);

  svg.setAttribute('width', maxX);
  svg.setAttribute('height', maxY);
  svg.setAttribute('viewBox', `0 0 ${maxX} ${maxY}`);

  let svgContent = `
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#4a4a6a"/>
      </marker>
      <marker id="arrowhead-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#00e5ff"/>
      </marker>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  `;

  // Draw edges first
  edges.forEach((edge, i) => {
    const from = positions[edge.from];
    const to = positions[edge.to];
    if (!from || !to) return;

    const fromNode = nodes.find(n => n.id === edge.from);
    const toNode = nodes.find(n => n.id === edge.to);

    const x1 = from.x + NODE_W / 2;
    const y1 = from.y + NODE_H;
    const x2 = to.x + NODE_W / 2;
    const y2 = to.y;

    const midY = (y1 + y2) / 2;
    const path = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
    const isYes = edge.label === 'Yes' || edge.label === 'True';
    const isNo = edge.label === 'No' || edge.label === 'False';
    const color = isYes ? '#39ff88' : isNo ? '#ff5555' : '#4a4a6a';

    svgContent += `
      <path class="edge-path" d="${path}" stroke="${color}" opacity="0.7" marker-end="url(#arrowhead)"/>
    `;

    if (edge.label) {
      const lx = (x1 + x2) / 2;
      const ly = midY;
      svgContent += `
        <rect x="${lx - 18}" y="${ly - 10}" width="36" height="18" rx="4" fill="#16161f" opacity="0.9"/>
        <text class="edge-label" x="${lx}" y="${ly + 4}" text-anchor="middle" fill="${color}" font-weight="700">${edge.label}</text>
      `;
    }
  });

  // Draw nodes
  nodes.forEach((node, idx) => {
    const pos = positions[node.id];
    if (!pos) return;
    const x = pos.x, y = pos.y;
    const type = node.type || 'process';
    const delay = idx * 0.07;

    svgContent += `<g class="node-group" style="animation-delay:${delay}s" 
      onmouseenter="showTooltip(event, '${(node.description || node.label).replace(/'/g, "&#39;")}')"
      onmousemove="moveTooltip(event)"
      onmouseleave="hideTooltip()">`;

    if (type === 'terminal') {
      // Rounded rectangle (start/end)
      svgContent += `
        <rect class="node-rect" x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}"
          rx="${TERMINAL_RX}" ry="${TERMINAL_RX}"
          fill="rgba(57,255,136,0.1)" stroke="#39ff88" stroke-width="1.5"/>
        <text class="node-text" x="${x + NODE_W/2}" y="${y + 36}" text-anchor="middle" fill="#39ff88">${escXML(node.label)}</text>
      `;
    } else if (type === 'decision') {
      // Diamond
      const cx = x + NODE_W / 2, cy = y + NODE_H / 2;
      const hw = NODE_W / 2, hh = NODE_H / 2 + 10;
      svgContent += `
        <polygon class="node-rect"
          points="${cx},${cy-hh} ${cx+hw},${cy} ${cx},${cy+hh} ${cx-hw},${cy}"
          fill="rgba(181,123,238,0.1)" stroke="#b57bee" stroke-width="1.5"/>
        <text class="node-text" x="${cx}" y="${cy + 5}" text-anchor="middle" fill="#b57bee">${escXML(node.label)}</text>
      `;
    } else if (type === 'io') {
      // Parallelogram
      const skew = 14;
      svgContent += `
        <polygon class="node-rect"
          points="${x+skew},${y} ${x+NODE_W},${y} ${x+NODE_W-skew},${y+NODE_H} ${x},${y+NODE_H}"
          fill="rgba(255,184,48,0.1)" stroke="#ffb830" stroke-width="1.5"/>
        <text class="node-text" x="${x+NODE_W/2}" y="${y+36}" text-anchor="middle" fill="#ffb830">${escXML(node.label)}</text>
      `;
    } else {
      // Process rectangle
      svgContent += `
        <rect class="node-rect" x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}"
          rx="6" fill="rgba(0,229,255,0.07)" stroke="#00e5ff" stroke-width="1.5"/>
        <text class="node-text" x="${x + NODE_W/2}" y="${y + 30}" text-anchor="middle">${escXML(truncate(node.label, 22))}</text>
      `;
      if (node.sublabel) {
        svgContent += `<text class="node-sub" x="${x + NODE_W/2}" y="${y + 46}" text-anchor="middle">${escXML(truncate(node.sublabel, 28))}</text>`;
      }
    }

    svgContent += `</g>`;
  });

  svg.innerHTML = svgContent;
  svgData = `<svg xmlns="http://www.w3.org/2000/svg" width="${maxX}" height="${maxY}" viewBox="0 0 ${maxX} ${maxY}">${svgContent}</svg>`;
  emptyState.style.display = 'none';
}

function escXML(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function truncate(s, max) {
  return s && s.length > max ? s.slice(0, max - 1) + '…' : s;
}

function assignLevels(nodes, edges) {
  const levels = {};
  const inDegree = {};
  nodes.forEach(n => { inDegree[n.id] = 0; levels[n.id] = 0; });
  edges.forEach(e => { if (inDegree[e.to] !== undefined) inDegree[e.to]++; });

  const queue = nodes.filter(n => inDegree[n.id] === 0).map(n => n.id);
  const visited = new Set();

  while (queue.length) {
    const id = queue.shift();
    if (visited.has(id)) continue;
    visited.add(id);
    const outEdges = edges.filter(e => e.from === id);
    outEdges.forEach(e => {
      levels[e.to] = Math.max(levels[e.to] || 0, (levels[id] || 0) + 1);
      queue.push(e.to);
    });
  }
  return levels;
}

function computePositions(nodes, edges, levels) {
  const byLevel = {};
  nodes.forEach(n => {
    const l = levels[n.id] || 0;
    if (!byLevel[l]) byLevel[l] = [];
    byLevel[l].push(n.id);
  });

  const positions = {};
  const MARGIN_X = 40, MARGIN_Y = 40;

  Object.keys(byLevel).sort((a,b) => a-b).forEach(level => {
    const ids = byLevel[level];
    const totalW = ids.length * (NODE_W + H_GAP) - H_GAP;
    ids.forEach((id, i) => {
      const x = MARGIN_X + i * (NODE_W + H_GAP);
      const y = MARGIN_Y + level * (NODE_H + V_GAP);
      positions[id] = { x, y };
    });
  });

  return positions;
}

// ─── GENERATE ────────────────────────────────────────────────────────────────
async function generateFlowchart() {
  const text = input.value.trim();
  if (!text) return;

  genBtn.classList.add('loading');
  genBtn.disabled = true;
  emptyState.style.display = 'flex';
  emptyState.querySelector('.empty-text').textContent = 'Generating your flowchart…';
  emptyState.querySelector('.empty-sub').textContent = 'AI is thinking';
  svg.innerHTML = '';

  const systemPrompt = `You are a flowchart generator. Given a concept, algorithm, or process description, return ONLY a JSON object (no markdown, no explanation) that represents a flowchart.

The JSON must have this exact structure:
{
  "nodes": [
    { "id": "n1", "type": "terminal", "label": "Start", "description": "Starting point" },
    { "id": "n2", "type": "process", "label": "Short label", "sublabel": "optional detail", "description": "Tooltip explanation" },
    { "id": "n3", "type": "decision", "label": "Condition?", "description": "What is being decided" },
    { "id": "n4", "type": "io", "label": "Input/Output", "description": "Data being read or written" },
    { "id": "n5", "type": "terminal", "label": "End", "description": "End point" }
  ],
  "edges": [
    { "from": "n1", "to": "n2" },
    { "from": "n3", "to": "n4", "label": "Yes" },
    { "from": "n3", "to": "n5", "label": "No" }
  ]
}

Rules:
- Node types: "terminal" (start/end), "process" (action/step), "decision" (yes/no branch), "io" (input or output)
- Keep labels SHORT (max 4 words). Put details in "description" for tooltip.
- Use 6-16 nodes for a good flowchart.
- Edge labels: "Yes"/"No" for decisions only.
- Return ONLY the raw JSON. No markdown fences, no text before or after.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: text }]
      })
    });

    const data = await response.json();
    const raw = data.content.map(b => b.text || '').join('');
    const parsed = parseNodes(raw);

    if (parsed && parsed.nodes && parsed.edges) {
      buildFlowchart(parsed);
    } else {
      showError('Could not parse the flowchart. Try rephrasing your input.');
    }
  } catch (err) {
    showError('Error connecting to AI. Please try again.');
    console.error(err);
  } finally {
    genBtn.classList.remove('loading');
    genBtn.disabled = false;
  }
}

function showError(msg) {
  emptyState.style.display = 'flex';
  emptyState.querySelector('.empty-icon').textContent = '⚠';
  emptyState.querySelector('.empty-text').textContent = msg;
  emptyState.querySelector('.empty-sub').textContent = 'Try again with a different input';
}

// Enter key shortcut
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generateFlowchart();
});
</script>
